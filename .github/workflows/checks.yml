name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - run: ./scripts/build-release.ps1
      - name: Verify installer payload and app
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'installer-check.json'
          $check = Start-Process ./output/releases/AssetRaider-0.3.9-Setup.exe -ArgumentList '--verify-install', ('"' + $report + '"') -Wait -PassThru
          Get-Content $report
          if ($check.ExitCode -ne 0) { throw 'Installer checks failed.' }
      - name: Verify source quality in isolated Chrome
        shell: pwsh
        run: |
          New-Item -ItemType Directory output/quality-check -Force | Out-Null
          Copy-Item tests/fixtures/source-96k-44100.mp3 output/quality-check/
          $check = Start-Process ./output/desktop-0.3.9/AssetRaider.exe -ArgumentList '--quality-check', 'output/quality-check' -Wait -PassThru -WindowStyle Hidden
          Get-Content output/quality-check/quality-check.json
          if ($check.ExitCode -ne 0) { throw 'Source quality detection failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-quality-check
          path: output/quality-check/quality-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: output/releases/*
